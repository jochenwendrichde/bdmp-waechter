name: BDMP-Wächter Marsberg

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten
  workflow_dispatch:

permissions:
  contents: write

concurrency: watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Seite prüfen
        env:
          BDMP_KENNUNG: ${{ secrets.BDMP_KENNUNG }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'jw-bdmp-marsberg-42164d02ba' }}
        run: python3 watch.py
      - name: Stand speichern
        if: always()
        run: |
          git config user.name "bdmp-waechter"
          git config user.email "actions@users.noreply.github.com"
          git add state.json || exit 0
          git diff --cached --quiet || (git commit -m "Stand aktualisiert" && git push)
